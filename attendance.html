{% extends "base.html" %}{% block content %}<h2>Attendance Tracking</h2><section class="panel"><form method="post" class="grid"><select name="member_id" required><option value="">Select member</option>{% for m in members %}<option value="{{m.id}}">{{m.name}}</option>{% endfor %}</select><button {% if not members %}disabled{% endif %}>Mark Attendance</button></form></section><section class="panel"><h2>Attendance History</h2><div class="scroll"><table><tr><th>Member</th><th>Date</th></tr>{% for r in records %}<tr><td>{{r.member_name}}</td><td>{{r.attendance_date}}</td></tr>{% else %}<tr><td colspan="2">No records yet.</td></tr>{% endfor %}</table></div></section>{% endblock %}
